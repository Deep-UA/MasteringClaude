# Copy of upstream _docker/vhost.conf (github.com/testsmith-io/practice-software-testing).
# Used with the official multi-arch nginx image, because upstream's prebuilt
# practice-software-testing-web image is arm64-only ("exec format error" on amd64 runners).
server {
    listen 80;
    index index.php index.html;
    server_name testform.d;
    root /var/www/public;
    server_tokens off;

    location / {
        try_files $uri /index.php?$args;
    }

    # Server-Sent Events endpoint (/sales-stream): forward straight to PHP with
    # buffering disabled so events reach the browser as they are written instead
    # of being held back until the stream ends.
    location = /sales-stream {
        fastcgi_pass laravel-api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_buffering off;
        gzip off;
        fastcgi_read_timeout 3600s;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel-api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
