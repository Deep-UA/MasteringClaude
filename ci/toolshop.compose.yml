# Local copy of the Toolshop app under test, for CI (no Cloudflare, no shared data).
# Based on upstream docker-compose.prod.yml (github.com/testsmith-io/practice-software-testing),
# trimmed to what the tests need. UI: http://localhost:4200  API: http://localhost:8091
# The database starts empty: seed it with
#   docker compose -f ci/toolshop.compose.yml exec -T laravel-api php artisan migrate:refresh --seed
name: toolshop

services:
  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api:2.5
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - DB_PORT=3306
      - DB_HOST=mariadb
      - host=localhost
      - DISABLE_LOGGING=true
    volumes:
      - laravel-app-code:/var/www
    depends_on:
      - mariadb

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui:2.5
    ports:
      - "4200:4200"
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"

  web:
    # Upstream publishes only `latest` for the nginx front of the API.
    image: testsmith/practice-software-testing-web:latest
    ports:
      - "8091:80"
    depends_on:
      - laravel-api

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

volumes:
  laravel-app-code:
