name: Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLURE_VERSION: "2.46.1"

jobs:
  smoke:
    # Pinned: Playwright-supported image, and no silent image upgrades (ubuntu-latest moved to 26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Optional: lets the teardown delete the per-run test users. Cleanup is skipped if unset.
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full version tags (no moving `v10` tag).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # No --with-deps: the runner image already has Chromium's system libraries, and apt
      # (only needed for extra non-Latin fonts) failed on DNS for the Ubuntu mirrors.
      - name: Install Chromium
        timeout-minutes: 5
        run: uv run playwright install chromium

      # API only: Cloudflare's bot check on practicesoftwaretesting.com blocks the browser from
      # GitHub-hosted runners ("Just a moment..."). Run UI smoke locally until CI hosts the app itself.
      - name: Run smoke tests (API)
        run: uv run pytest -m "smoke and api" -n auto

      - name: Set up Java (for Allure CLI)
        if: ${{ !cancelled() }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | tar -xz -C "$RUNNER_TEMP"
          # Single file: the downloaded artifact opens in a browser without a web server.
          "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin/allure" generate allure-results --clean --single-file -o allure-report

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
