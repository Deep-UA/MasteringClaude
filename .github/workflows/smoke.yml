name: Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLURE_VERSION: "2.46.1"

jobs:
  smoke:
    # Pinned: Playwright-supported image, and no silent image upgrades (ubuntu-latest moved to 26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Tests run against a local copy of the app (ci/toolshop.compose.yml), not the public demo:
      # its Cloudflare bot check blocks browsers on GitHub-hosted runners ("Just a moment...").
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:8091
      COMPOSE_FILE: ci/toolshop.compose.yml
      # Optional: lets the teardown delete the per-run test users. Cleanup is skipped if unset.
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Start Toolshop app
        timeout-minutes: 10
        run: docker compose up -d --quiet-pull

      - name: Seed database
        timeout-minutes: 3
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mariadb mysqladmin ping -h localhost -uroot -proot --silent && break
            sleep 2
          done
          docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Wait for API and UI
        timeout-minutes: 6
        run: |
          wait_for() {  # url, attempts (5 s apart)
            for i in $(seq 1 "$2"); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' "$1")" = 200 ] && { echo "$1 ready"; return 0; }
              sleep 5
            done
            echo "$1 not ready"; docker compose logs --tail 50; return 1
          }
          wait_for "$API_URL/status" 24
          wait_for "$BASE_URL" 60  # ng serve compiles on start

      # setup-uv publishes only full version tags (no moving `v10` tag).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # No --with-deps: the runner image already has Chromium's system libraries, and apt
      # (only needed for extra non-Latin fonts) failed on DNS for the Ubuntu mirrors.
      - name: Install Chromium
        timeout-minutes: 5
        run: uv run playwright install chromium

      - name: Run smoke tests
        run: uv run pytest -m smoke -n auto

      - name: App logs
        if: failure()
        run: docker compose logs --tail 200

      - name: Set up Java (for Allure CLI)
        if: ${{ !cancelled() }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | tar -xz -C "$RUNNER_TEMP"
          # Single file: the downloaded artifact opens in a browser without a web server.
          "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin/allure" generate allure-results --clean --single-file -o allure-report

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
